# Settings for the multi-agent orchestrator.
#
# Settings are read in layers, each overriding the one before:
#   1. the global settings, ritam.yaml in the app home
#      (%LOCALAPPDATA%\ritam on Windows, ~/.ritam elsewhere, or $RITAM_HOME);
#   2. the project's settings: ritam.yaml in the project folder and/or
#      .ritam/ritam.yaml in its hidden folder.
# Only what a file sets is overridden, so a project file can hold just the
# few settings that differ for that project. `ritam where` shows the paths;
# `ritam config check` shows the settings in force and where each came from.
#
# How a later file overrides an earlier one:
#   - a setting such as orchestrator.maxTaskCostUSD: just that setting; the
#     rest of its section comes from the earlier files;
#   - a list (access.commands, allowedCommands, args): the whole list is
#     replaced, never added to; [] empties it;
#   - providers: field by field. A project that sets only
#     providers.codex.allowWrites keeps codex's executable and timeouts from
#     the global file;
#   - agents: entry by entry, and an entry REPLACES THE WHOLE AGENT. A
#     project that lists agents.lead with only `model:` gets an agent with
#     no type, role or executable from the global file, so repeat every
#     field you need. Agents the project does not list are kept.
# A project's files may tighten anything but not loosen limits, choose the
# programs run or their arguments, give agents write access, switch the mock
# agents off, or change backups or the proxy; what they ask for beyond that
# is held back and you are told at start.
#
# Keys are read exactly as written here, capitals included: a key ritam does
# not know (maxDailyCostUsd for maxDailyCostUSD) stops it starting, with the
# file, the key and the nearest valid key named, rather than being ignored.
#
# Copy to one of those places and edit. Everything here is local: there is no remote
# config source, and NO API KEYS BELONG IN THIS FILE. Claude Code and Codex
# authenticate through their own CLI mechanisms; the orchestrator never reads
# or stores provider credentials.

# How to run each provider's CLI. This file defines no agents: the team is
# recruited in the TUI. Press n for a new task, tick the models it needs
# under Recruit (Opus x2, Sonnet, GPT-6-Sol, ...), and tick one participant
# as the authority. Agents are named after their model (opus-1, sonnet-1),
# kept in .ritam/team.json, and started the way their provider says here.
providers:
  claude-code:
    # Resolved on PATH when not an absolute path. Never hard-code an install
    # location: Claude Code and Codex are installed differently per machine,
    # and on Windows these are usually shims on PATH.
    executable: claude
    startupTimeout: 30s
    # Each CLI invocation (one turn) is bounded: responseTimeout for an agent
    # that only reads, writeResponseTimeout for one that may write files or run
    # commands (builds and tests take longer). A turn that times out is tried
    # once more; a second timeout drops a supporting agent or pauses the task.
    responseTimeout: 5m
    writeResponseTimeout: 20m
    # Agents may edit files, only ever inside the workspace (the folder ritam
    # runs in). false makes this provider's agents read-only.
    allowWrites: true
    # Commands these agents may run besides access.commands (at the access
    # levels that use the list).
    allowedCommands: []

  codex:
    executable: codex
    startupTimeout: 30s
    responseTimeout: 5m
    writeResponseTimeout: 20m
    allowWrites: true        # maps to codex's workspace-write sandbox
    allowedCommands: []

orchestrator:
  maxConcurrentTasks: 1
  # Loop protection meters AUTONOMOUS agent work only. Any human input (an
  # instruction, a follow-up, a resume, an approval or rejection) starts a fresh
  # allowance, and messages to or from the human never count. Reaching a hard
  # limit PAUSES the task for a human; it never picks a winner.
  #
  # Checkpoint interval, not a limit: every this many authority-led agent
  # rounds without human input, the authority posts a progress STATUS_UPDATE
  # and you are notified. Work continues; long tasks need many rounds.
  maxDeliberationRounds: 10
  # Pause after this many agent-to-agent messages without human input.
  maxMessages: 200
  # Pause after this long without human input (not since the task was created,
  # so a follow-up hours later is not paused on arrival).
  maxTaskDuration: 30m
  # Pause after this many consecutive agent messages that make no progress:
  # no request answered, nothing new produced, or a repeat of an earlier
  # message. This is what catches agents going in circles.
  stallMessages: 8
  # Absolute ceiling over the task's whole life. Nothing resets it.
  maxTotalMessages: 1000
  # Spending ceilings from the usage the CLIs report. 0 disables each.
  # Claude reports cost; Codex reports tokens only, so only maxTaskTokens
  # bounds Codex spending. Tokens count fresh input and output, not what is
  # re-read from the cache. Each Claude turn is also capped (--max-budget-usd)
  # at its share of what is left of the task's budget and the day's, so a task
  # stops within about one API call of it. Whether the CLI counts only the
  # turn on a resumed session is unverified. Codex turns get no dollar cap.
  maxTaskCostUSD: 10
  maxTaskTokens: 5000000
  # The same over a whole day, every task and project on this machine
  # together: each task's budget is its own, and a new task starts afresh.
  maxDailyCostUSD: 50
  maxDailyTokens: 25000000
  # Hold a task at AWAITING_DECISION until the human approves or rejects the
  # authority agent's FINAL_DECISION.
  requireHumanApproval: false
  # Pause the task if no agent says or does anything for this long. It does
  # not run while an agent is working: a long CLI turn, even a silent one, is
  # bounded by its provider's responseTimeout / writeResponseTimeout instead.
  idleTimeout: 60s
  # A usage limit that resets within this long is waited out and the turn
  # tried again; one that resets later pauses the task, saying when.
  maxRateLimitWait: 2m

# Where tasks, messages, events, decisions and shared knowledge are kept.
# sqlite (default): the project's own database, .ritam/ritam.db in its hidden
#   folder; tasks survive a restart, so a completed task can still be
#   followed up next session.
# memory: everything is lost when ritam exits.
# Only one ritam may use a project's database at a time.
storage:
  backend: sqlite

# A `knowledge:` section (backend, path), found in older settings files, is
# still accepted so those files load, but it currently has no effect: shared
# knowledge is kept in the storage above.

# Each project's database is backed up into the app home
# (backups/<project>-<id>/): when a task finishes, when ritam exits, every
# `interval` while work is going on, and before the database is upgraded.
# Nothing is written while the project is idle. `ritam backups` lists them,
# `ritam restore` brings one back.
backups:
  enabled: true
  keep: 5                  # snapshots kept per project, at least 1
  # At least 1m. 0 turns the periodic snapshots off (those when a task
  # finishes and at exit are still taken); a negative value is an error.
  interval: 10m
  # A project whose folder was deleted: ask (say so at start, keep its
  # backups until told), keep, or delete (after deleteAfterDays, at least 1).
  whenProjectDeleted: ask
  deleteAfterDays: 30

proxy:
  # The local LLM proxy is NOT the orchestrator. It handles provider traffic,
  # transformation, logging, token accounting and context optimization only.
  # Not implemented in this phase.
  enabled: false
  host: 127.0.0.1
  port: 8787
  logRequests: true

logging:
  level: info              # debug | info | warn | error
  format: text             # text | json
  # The TUI owns the terminal, so logs go to a file: one per project in the
  # app home's logs folder, unless a file is given here.

tui:
  # Does not work in this version: the demo task it creates has only one
  # participant (orchestrator.defaultAuthority) and is refused. Leave it off.
  demoOnStart: false
  # Force every agent onto the mock adapter. Defaults to true so that nothing
  # reaches a real provider by accident. The `-real` flag overrides this; a
  # project's own settings cannot set it to false.
  # Whenever the real CLIs are used (false here, or `-real`), idleTimeout is
  # raised to at least 10m, since they take minutes rather than milliseconds
  # to answer.
  useMockAgents: true

# Persistent agent sessions. Each agent keeps its own Claude Code / Codex
# conversation per task and resumes it on every turn (claude --resume,
# codex exec resume), so it remembers the deliberation and can be followed up.
# The record of which CLI session belongs to which agent on which task is
# kept in the project's hidden folder (.ritam/sessions.json).

# The workspace: where agents work, and the only place an agent with
# allowWrites may write. It is the folder holding this file unless set here.
# Launched at a global location (your home folder, a drive root, a system
# folder), agents work read-only in ritam's own folder (~/.ritam/workspace);
# allowGlobal lets them write there. Nothing is written to temp folders.
# confineReads keeps Claude Code's file tools reading inside the agent's
# working folder (always on after a global launch); off, agents may read
# anywhere you can.
workspace:
  root: ""
  allowGlobal: false
  confineReads: false

# What agents may run beyond editing files, chosen per workspace. Set it from
# the TUI's settings tab (:settings), which saves it to .ritam/ritam.yaml;
# the project's settings override these global ones.
#   0  Files only         edit files, run read-only commands (the default)
#   1  Sandboxed builder  only agents whose CLI runs in a sandbox (Codex) may
#                         build and test, with the commands below; the others
#                         ask them
#   2  Build and test     every agent may run the commands below
#   3  Any command        anything inside the workspace except the blocked list
# Always blocked, at every level: deleting files, system settings,
# permissions, killing processes, network access, installing software,
# rewriting git history. A global launch stays at level 0. A level a
# project's own settings ask for is granted only once you approved it on this
# machine for that folder (a clone or copy starts at 0). Claude Code has a
# sandbox only on macOS, Linux and WSL2. Without one (native Windows) it runs
# no commands at any level unless allowUnsandboxed is set below; then level 2
# runs the listed commands directly on this machine, and level 3 means you
# trust these agents.
access:
  level: 0
  commands: []
  # for example:
  #  - cmake
  #  - ctest
  # Agents with no verified sandbox (Claude Code on native Windows) run no
  # commands at any level unless this is true; they ask an agent that has a
  # sandbox, or you. Only honoured in the global settings in the app home.
  # allowUnsandboxed: false

# Every tool call an agent makes goes through ritam's review before it runs:
# its command is parsed and checked against ritam's rules. A harmful call is
# refused, a critical one also stops the agent's turn and pauses the task.
# The mode says who approves the rest:
#   auto    ritam's rules decide, asking you about suspicious calls. Rules
#           cannot foresee everything: a destructive command can still get
#           through.
#   manual  you approve every command as well.
# The access level above still bounds what may be attempted. A project's
# settings may choose manual, never auto over your global manual.
review:
  mode: auto
  # How long a call waits for your answer before it is refused.
  askTimeout: 5m
  # Your own rules, added to ritam's. They run nothing and can only make the
  # review stricter, so a project's rules join yours rather than replace
  # them. A command pattern is read like a command: "git push --force"
  # matches any git command whose subcommand starts with push and that has
  # --force, however it is written (git -C repo push --force origin); it
  # does not match git push -f, so list both. protect is a path glob,
  # relative to the workspace unless absolute: changing, deleting or
  # linking a match is refused.
  rules:
    deny: []
    ask: []
    protect: []
    # for example:
    #  deny: [terraform apply, terraform destroy]
    #  ask: [npm publish]
    #  protect: [infra/prod/**]
  # Programs of your own run on every tool call, with the call as JSON on
  # stdin. Exit 2 refuses it (stderr is the reason); exit 0 has no
  # objection unless stdout says {"decision": "deny"} or {"decision": "ask"}
  # (Claude Code's hookSpecificOutput form works too). A hook never
  # approves a call. input: ritam (the same JSON for every CLI, with what
  # ritam found) or native (the CLI's own hook payload). onFailure: block
  # (the default: a crash or timeout refuses the call) or ignore. timeout:
  # 10s by default, 15s at most. A project's hooks run only once you
  # approve them on this machine.
  hooks: []
  # for example:
  #  - name: no-push-to-main
  #    run: [python, C:/hooks/no_push.py]
  #    tools: [Bash, shell]
  #    agents: [claude-code, codex]
  #    input: ritam
  #    timeout: 10s
  #    onFailure: block
