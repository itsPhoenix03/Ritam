# harmful-commands.yaml
#
# Rules ritam's pre-tool-use review checks every agent tool call against.
# The CLI loads this file, turns each tool call into "facts" with the parser
# described in command-parsing.md, and tests every rule below against them.
#
# ---------------------------------------------------------------------------
# HOW A RULE IS READ
# ---------------------------------------------------------------------------
#
#   - id: destroy.recursive-delete.outside   unique, dotted
#     category: destruction                  see "categories" below
#     severity: critical                     info | suspicious | harmful | critical
#     os: [linux, macos, windows]            optional; default: every OS
#     dialect: [bash, powershell, cmd]       optional; default: every dialect
#     on: command                            what the rule is tested against (below)
#     match: {...}                           every key must hold (AND)
#     unless: {...}                          optional; if every key holds, the rule does not fire
#     reason: text shown to the model and the human when the rule fires
#     examples: {hit: [...], miss: [...]}    test cases; see "EXAMPLES"
#
# A list value inside match/unless means "any of these" (OR).
# A string starting with "@" inside a list is replaced by the named entry
# from "lists:" or "paths:" below.
#
# ---------------------------------------------------------------------------
# on: WHAT THE RULE IS TESTED AGAINST
# ---------------------------------------------------------------------------
#
#   command   every normalized simple command found in a shell tool call,
#             including those inside pipes, $( ), backticks, <( ), -c strings,
#             here-docs fed to a shell, decoded -EncodedCommand payloads,
#             find -exec, xargs, wrappers (sudo, env, nohup...) and so on.
#             Wrappers are reported as their own command AND the inner command
#             is reported with wrapped_by set.
#   path      every path any tool touches (shell commands, Read, Write, Edit,
#             MultiEdit, NotebookEdit, apply_patch, Glob, Grep).
#   content   text: content added by edits, inline code (-c/-e/-Command),
#             here-doc bodies, decoded payloads, tool output, agent messages.
#   url       every URL or remote host (shell arguments, WebFetch, MCP args).
#   input     the whole raw input of a shell tool call (statement-level patterns
#             such as fork bombs that are not a single simple command).
#   sequence  the ordered history of the current turn.
#   meta      parser results (parse errors, limits, unknown tools).
#
# ---------------------------------------------------------------------------
# KEYS FOR on: command
# ---------------------------------------------------------------------------
#
#   program            normalized program names (see command-parsing.md §6.1):
#                      basename, no .exe/.cmd/.bat/.com/.ps1, lowercase,
#                      PowerShell aliases resolved to cmdlet names,
#                      .NET calls as "namespace.type::method" (static),
#                      "namespace.type.method" (instance), "namespace.type::new"
#   program_regex      regex on the normalized program name
#   program_raw_regex  regex on the program word exactly as written (quotes,
#                      backslashes, carets, backticks kept)
#   program_indirect   true if the program name came from a variable, a
#                      substitution or string building (resolved or not)
#   subcommand         the command's non-flag words, joined by one space, start
#                      with one of these (whole words, case-insensitive)
#   subcommand_regex   regex on that joined non-flag text
#   flags_any          at least one of these normalized flags is present
#   flags_all          all of these normalized flags are present
#   args_any           some argument token equals one of these
#   args_regex         some argument token matches (tested on the literal value
#                      AND on the token's source text)
#   argline_regex      regex on all argument values joined by one space (a token
#                      only known at run time appears as its source text)
#   argc_max           number of argument tokens is at most this
#   args_dynamic       true if some argument is only known at run time
#   inline_code        true if the command carries inline code (-c, -e, -Command,
#                      here-doc or stdin script)
#   inline_dynamic     true if that inline code is only known at run time
#   pipe_from          the program writing into this command's stdin
#   pipe_to            the program reading this command's stdout
#   arg_from           programs whose output becomes (part of) an argument,
#                      through $( ), backticks, <( ), PowerShell ( ) / $( ),
#                      at any depth
#   wrapped_by         wrappers removed while normalizing (sudo, env, xargs...)
#   assigns_any        environment variables assigned (X=1 cmd, export X=,
#                      $env:X =, set X= in cmd)
#   assigns_regex      regex on assigned variable names
#   raw_regex          regex on the simple command's source text
#   path               {access, zone, glob}: some path of this command matches all
#   url                {host_regex, host_not, scheme}: some URL of this command
#
# KEYS FOR on: path      access, zone, glob, tool
# KEYS FOR on: content   scope, path_glob, regex_any
# KEYS FOR on: url       host_regex, host_not, scheme, path_regex
# KEYS FOR on: input     regex_any
# KEYS FOR on: sequence  steps, count, within_calls
# KEYS FOR on: meta      parse_error, limit_exceeded, unknown_tool, tool
#
# access:  read | list | write | delete | exec | link | meta
#          (link = the TARGET of a link or bind mount being created;
#           meta = permission, owner or attribute change)
# zone:    build | workspace | protected | ritam | temp | home | system |
#          outside | unc | device | null | registry | unknown
#          (see command-parsing.md §7.4 for how each is decided)
# tool:    shell | read | edit | search | web | mcp | other
#          (edit = Write, Edit, MultiEdit, NotebookEdit, apply_patch)
# scope:   edit | inline | heredoc | decoded | output | message
#
# Globs: "**" any number of folders (also zero), "*" anything inside one name,
# "?" one character. "dir/**" also matches "dir" itself.
# "/" also matches "\". Matching is case-insensitive on
# Windows and macOS. Placeholders: "~" home folder, "{workspace}" workspace
# root, "{build}" the agent's build folder, %APPDATA% %LOCALAPPDATA%
# %PROGRAMDATA% %WINDIR% %PROGRAMFILES% %TEMP% (Windows). A glob starting with
# "**/" matches at any depth anywhere. Registry keys are matched as
# HKLM/..., HKCU/..., HKU/..., HKCR/... .
#
# Regexes are Go RE2 syntax (no lookahead, no backreferences). Comparisons of
# program names and subcommands are case-insensitive. On Windows every
# comparison is case-insensitive; on Linux/macOS flags and args are
# case-sensitive.
#
# ---------------------------------------------------------------------------
# EXAMPLES
# ---------------------------------------------------------------------------
# A plain string is a command in the rule's first dialect (bash if none).
# {bash: ...} {ps: ...} {cmd: ...} pick the dialect. {write: path} {read: path}
# {edit: path, content: text} are file tools; {url: ...} is WebFetch;
# {output: text} is tool output. Examples run with cwd = {workspace},
# {build} = {workspace}/build, home outside the workspace.
# Every "hit" must fire the rule; every "miss" must not fire it.
# ---------------------------------------------------------------------------

version: 1

actions:
  info: record
  suspicious: ask          # human or reviewer decides; denied if nobody answers in time
  harmful: deny            # blocked; reason sent to the model
  critical: deny-and-stop  # blocked, turn stopped, task paused, human alerted

categories:
  destruction: Deleting or overwriting files, wiping disks or backups
  git: Destroying git history or publishing without review
  escape: Leaving the workspace
  persistence: Making something run again later
  credentials: Reading or leaking secrets
  network: Downloading, uploading, connecting out
  obfuscation: Hiding what really runs
  system: Changing the operating system, users or permissions
  resources: Using up CPU, memory or disk
  supply-chain: Installing or publishing packages
  tamper: Attacking ritam or the agent CLIs

# ===========================================================================
# NAMED LISTS (referenced as "@name")
# ===========================================================================
lists:
  shells: [sh, bash, zsh, dash, ksh, mksh, ash, fish, csh, tcsh, busybox]
  win_shells: [cmd, powershell, pwsh, powershell_ise]
  interpreters: [python, python2, python3, py, pypy, pypy3, perl, ruby, node, nodejs, deno, bun, php, lua, luajit, tclsh, wish, osascript, jshell, groovy, julia, rscript, awk, gawk, mawk, nawk, wscript, cscript, mshta]
  eval_programs: [eval, invoke-expression, source, '.', 'system.management.automation.scriptblock::create']
  downloaders:
    - curl
    - wget
    - wget2
    - aria2c
    - axel
    - fetch
    - http
    - https
    - xh
    - lwp-download
    - lwp-request
    - nscurl
    - invoke-webrequest
    - invoke-restmethod
    - start-bitstransfer
    - bitsadmin
    - certutil
    - 'system.net.webclient.downloadstring'
    - 'system.net.webclient.downloaddata'
    - 'system.net.webclient.downloadfile'
    - 'system.net.webclient.openread'
    - 'system.net.http.httpclient.getstringasync'
    - 'system.net.http.httpclient.getbytearrayasync'
    - 'system.net.http.httpclient.getasync'
    - 'system.net.webrequest::create'
  decoders: [base64, base32, basenc, xxd, uudecode, openssl, rev, gunzip, zcat, xzcat, bzcat, certutil, 'system.convert::frombase64string', 'system.text.encoding.getstring']
  raw_net: [nc, ncat, netcat, nc.traditional, nc.openbsd, socat, telnet, cryptcat, pwncat, 'system.net.sockets.tcpclient::new', 'system.net.sockets.socket::new', 'system.net.sockets.udpclient::new', 'system.net.sockets.tcplistener::new']
  remote_copy: [scp, sftp, pscp, psftp, ftp, lftp, tftp, ncftp, rclone, smbclient, azcopy, gsutil, s3cmd]
  remote_shell: [ssh, plink, mosh, autossh, sshpass, rsh, rlogin, winrs, psexec, psexec64, paexec, enter-pssession, new-pssession]
  tunnels: [ngrok, cloudflared, lt, localtunnel, bore, frpc, frps, chisel, zrok, tor, torsocks, proxychains, proxychains4, sshuttle, inlets, pinggy]
  dns_tools: [dig, nslookup, host, drill, kdig, delv, resolve-dnsname]
  mailers: [sendmail, mail, mailx, mutt, swaks, msmtp, ssmtp, send-mailmessage]
  win_proxy_exec: [mshta, rundll32, regsvr32, installutil, regasm, regsvcs, cmstp, msxsl, odbcconf, forfiles, pcalua, conhost, scriptrunner, syncappvpublishingserver, infdefaultinstall, ieexec, presentationhost, mavinject, hh, xwizard, msdt, diskshadow, cdb, csi, rcsi, appvlp, atbroker, wscript, cscript]
  nested_agents: [claude, claude-code, codex, gemini, aider, opencode, goose, amp, qwen, crush, cursor-agent, kiro, droid, copilot]
  model_hosts: ['api.anthropic.com', '*.anthropic.com', 'claude.ai', '*.claude.ai', 'api.openai.com', '*.openai.com', 'chatgpt.com', '*.chatgpt.com']
  package_hosts: ['registry.npmjs.org', 'registry.yarnpkg.com', 'pypi.org', 'files.pythonhosted.org', 'proxy.golang.org', 'sum.golang.org', 'crates.io', 'index.crates.io', 'static.crates.io', 'rubygems.org', 'repo.maven.apache.org', 'api.nuget.org', 'github.com', 'codeload.github.com', 'objects.githubusercontent.com', 'raw.githubusercontent.com']
  injection_env: [LD_PRELOAD, LD_LIBRARY_PATH, LD_AUDIT, DYLD_INSERT_LIBRARIES, DYLD_LIBRARY_PATH, DYLD_FRAMEWORK_PATH, BASH_ENV, ENV, PROMPT_COMMAND, PS4, SHELLOPTS, BASHOPTS, PYTHONSTARTUP, PYTHONPATH, PYTHONHOME, NODE_OPTIONS, NODE_PATH, PERL5OPT, PERL5LIB, PERLLIB, RUBYOPT, RUBYLIB, JAVA_TOOL_OPTIONS, _JAVA_OPTIONS, JDK_JAVA_OPTIONS, GIT_SSH, GIT_SSH_COMMAND, GIT_ASKPASS, SSH_ASKPASS, GIT_EXTERNAL_DIFF, GIT_PAGER, GIT_EDITOR, GIT_SEQUENCE_EDITOR, GIT_PROXY_COMMAND, GIT_CONFIG_GLOBAL, GIT_CONFIG_SYSTEM, GIT_CONFIG_COUNT, GIT_CONFIG_PARAMETERS, GIT_DIR, GIT_WORK_TREE, GIT_EXEC_PATH, GIT_TEMPLATE_DIR, PAGER, EDITOR, VISUAL, LESSOPEN, LESSCLOSE, MANPAGER, BROWSER, COMSPEC, PATHEXT, PSModulePath, COR_ENABLE_PROFILING, COR_PROFILER, COR_PROFILER_PATH, CORECLR_ENABLE_PROFILING, CORECLR_PROFILER, CORECLR_PROFILER_PATH, DOTNET_STARTUP_HOOKS, ELECTRON_RUN_AS_NODE]
  hook_env: [RITAM_HOOK_URL, RITAM_HOOK_TOKEN, RITAM_HOME, CLAUDE_CONFIG_DIR, CODEX_HOME, ANTHROPIC_BASE_URL, OPENAI_BASE_URL]
  trust_env: [NODE_TLS_REJECT_UNAUTHORIZED, PYTHONHTTPSVERIFY, GIT_SSL_NO_VERIFY, SSL_CERT_FILE, SSL_CERT_DIR, REQUESTS_CA_BUNDLE, CURL_CA_BUNDLE, NODE_EXTRA_CA_CERTS, HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, http_proxy, https_proxy, all_proxy]
  registry_env: [GOPROXY, GONOSUMDB, GONOSUMCHECK, GOSUMDB, GOINSECURE, GONOPROXY, GOPRIVATE, GOFLAGS, GOTOOLCHAIN, NPM_CONFIG_REGISTRY, npm_config_registry, YARN_NPM_REGISTRY_SERVER, PIP_INDEX_URL, PIP_EXTRA_INDEX_URL, PIP_TRUSTED_HOST, PIP_FIND_LINKS, UV_INDEX_URL, UV_EXTRA_INDEX_URL, UV_INDEX, UV_DEFAULT_INDEX]
  history_env: [HISTFILE, HISTSIZE, HISTFILESIZE, HISTCONTROL, HISTIGNORE, SAVEHIST]
  cloud_clis: [kubectl, oc, helm, terraform, tofu, pulumi, aws, gcloud, az, doctl, flyctl, fly, heroku, vercel, netlify, firebase, wrangler, gsutil, s3cmd, azcopy, eksctl, ansible, ansible-playbook, serverless, sls, cdk, sam]

